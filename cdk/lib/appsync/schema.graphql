type DebriefReady {
  documentId: ID! @aws_iam @aws_lambda
  draftId: String! @aws_iam @aws_lambda
  itemCount: Int! @aws_iam @aws_lambda
}

type Mutation {
  # Internal-only: invoked by the Feedback Engine Lambda via IAM auth.
  # Students cannot invoke this mutation directly.
  publishDebriefReady(documentId: ID!, draftId: String!, itemCount: Int!): DebriefReady
    @aws_iam
}

type Subscription {
  onDebriefReady(documentId: ID!): DebriefReady
    @aws_subscribe(mutations: ["publishDebriefReady"])
    @aws_lambda
}

type Query {
  # AppSync requires at least one Query field.
  _health: String
}
