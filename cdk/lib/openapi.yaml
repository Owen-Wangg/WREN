openapi: "3.0.3"
info:
  title: WREN Writing Coach API
  version: "1.0.0"
  description: |
    REST API for the WREN Writing Coach platform. All endpoints require
    authentication via the Cognito-backed Lambda authorizer except where noted.
    Authorization is enforced at two levels: the authorizer (coarse) and
    inside each service Lambda (fine-grained, per-operation scope checks).

servers:
  - url: "https://{apiId}.execute-api.{region}.amazonaws.com/{stage}"
    variables:
      apiId:
        default: "placeholder"
      region:
        default: "ca-central-1"
      stage:
        default: "dev"

x-amazon-apigateway-request-validators:
  body-only:
    validateRequestBody: true
    validateRequestParameters: false
  params-only:
    validateRequestBody: false
    validateRequestParameters: true
  full:
    validateRequestBody: true
    validateRequestParameters: true

x-amazon-apigateway-request-validator: params-only

x-amazon-apigateway-cors:
  allowedOrigins:
    - "*"
  allowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowedHeaders:
    - Content-Type
    - X-Amz-Date
    - Authorization
    - X-Api-Key
    - X-Amz-Security-Token
    - X-Amz-User-Agent
  exposeHeaders:
    - X-Amzn-RequestId
    - x-amzn-ErrorType
  maxAge: 86400

# --------------------------------------------------------------------------
# Security schemes
# --------------------------------------------------------------------------
components:
  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: custom
      x-amazon-apigateway-authorizer:
        type: token
        authorizerUri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunctionArn}/invocations"
        # Keep TTL low so a cached Deny from before first-login provisioning
        # does not block the newly provisioned Allow for several minutes.
        authorizerResultTtlInSeconds: 30
        identitySource: method.request.header.Authorization

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Error code (e.g., ValidationError, PermissionDenied, UsageLimitReached)
        message:
          type: string
          description: Human-readable error message

    # ==================== Core Domain Schemas ====================

    Department:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Unique department identifier
        name:
          type: string
          description: Department name (mutable)
          minLength: 1

    DocumentType:
      type: object
      required: [id, departmentId, name, accessState]
      properties:
        id:
          type: string
          description: Unique document type identifier
        departmentId:
          type: string
          description: Foreign key to Department (immutable)
        name:
          type: string
          description: Document type name
          minLength: 1
        accessState:
          type: string
          enum: [OPEN, LOCKED]
          description: |
            OPEN - any authenticated student may self-select and submit
            LOCKED - submission requires an Access Grant scoped to this DocumentType
        sizeLimitWords:
          type: integer
          nullable: true
          description: Word count limit for documents (null → inherit platform default)
          minimum: 1

    ContentType:
      type: object
      required: [id, documentTypeId, label]
      properties:
        id:
          type: string
          description: Unique content type identifier
        documentTypeId:
          type: string
          description: Foreign key to DocumentType
        label:
          type: string
          description: DepartmentAdmin-defined category label (e.g., "case brief", "memo")
          minLength: 1

    Topic:
      type: object
      required: [id, departmentId, name]
      properties:
        id:
          type: string
          description: Unique topic identifier
        departmentId:
          type: string
          description: Foreign key to Department (scoped to one department)
        name:
          type: string
          description: Business label for organizing work
          minLength: 1

    CustomMetadataField:
      type: object
      required: [id, documentTypeId, label, required]
      properties:
        id:
          type: string
          description: Unique field identifier
        documentTypeId:
          type: string
          description: Foreign key to DocumentType
        label:
          type: string
          description: Field label (e.g., "Writing Topic")
          minLength: 1
        required:
          type: boolean
          description: Whether this field must be populated at document submission

    ErrorCategory:
      type: object
      required: [id, documentTypeId, name]
      properties:
        id:
          type: string
          description: Unique error category identifier
        documentTypeId:
          type: string
          description: Foreign key to DocumentType
        name:
          type: string
          description: Category name for feedback classification (e.g., "Clarity", "Citation Format")
          minLength: 1
        internalGuidance:
          type: string
          nullable: true
          description: Internal guidance (never shown to students)

    AccessGrant:
      type: object
      required: [id, userId, documentTypeId, grantedBy, grantedAt]
      properties:
        id:
          type: string
          description: Unique access grant identifier
        userId:
          type: string
          description: Global user identifier (never department-owned)
        documentTypeId:
          type: string
          description: Foreign key to DocumentType
        grantedBy:
          type: string
          description: User ID of the administrator who granted access
        grantedAt:
          type: string
          format: date-time
          description: Timestamp when the grant was created
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the grant was revoked (null → still active)

    Override:
      type: object
      required: [id, userId, documentTypeId, bounds, reason, grantedBy, expiresAt]
      properties:
        id:
          type: string
          description: Unique override identifier
        userId:
          type: string
          description: Global user identifier
        documentTypeId:
          type: string
          description: Foreign key to DocumentType
        bounds:
          type: object
          required: [additionalActions]
          properties:
            additionalActions:
              type: integer
              description: Number of additional feedback requests allowed
        reason:
          type: string
          description: Reason for granting the override
        grantedBy:
          type: string
          description: User ID of the administrator who granted the override
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when the override expires

    Segment:
      type: object
      required: [index, text]
      properties:
        index:
          type: integer
          description: Zero-based paragraph index
          minimum: 0
        text:
          type: string
          description: Full text of the paragraph

    Document:
      type: object
      required: [id, ownerUserId, documentTypeId, contentTypeId, name, metadata, status, createdAt]
      properties:
        id:
          type: string
          description: Unique document identifier
        ownerUserId:
          type: string
          description: Global user ID of the document owner
        documentTypeId:
          type: string
          description: Foreign key to DocumentType
        contentTypeId:
          type: string
          description: Foreign key to ContentType (e.g., "case brief", "memo")
        name:
          type: string
          description: Document name
          minLength: 1
        metadata:
          type: object
          description: >-
            DepartmentAdmin-defined custom metadata field values
            (e.g., {"Writing Topic": "Contracts"})
          additionalProperties:
            type: string
        status:
          type: string
          enum: [Still Drafting, Polishing]
          description: Current document status
        createdAt:
          type: string
          format: date-time
          description: Timestamp when document was created

    Draft:
      type: object
      required: [id, documentId, versionNumber, s3Key, segments, wordCount, createdAt]
      properties:
        id:
          type: string
          description: Unique draft identifier
        documentId:
          type: string
          description: Foreign key to Document
        versionNumber:
          type: integer
          description: Monotonically increasing version number (starting at 1)
          minimum: 1
        s3Key:
          type: string
          description: S3 object key where full draft content is stored
          minLength: 1
        segments:
          type: array
          description: Ordered paragraph segments for anchoring and diffing
          items:
            $ref: "#/components/schemas/Segment"
        wordCount:
          type: integer
          description: Total word count in the draft
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: Timestamp when draft was created

    AnchorState:
      type: string
      enum: [active, removed]
      description: |
        active - anchor is valid and rendered to user
        removed - anchor text no longer found in document

    Anchor:
      type: object
      required: [id, feedbackItemId, draftId, paragraphIndex, startOffset, endOffset, contentFingerprint, state]
      properties:
        id:
          type: string
          description: Unique anchor identifier
        feedbackItemId:
          type: string
          description: Foreign key to FeedbackItem
        draftId:
          type: string
          description: Foreign key to Draft (which version this anchor is for)
        paragraphIndex:
          type: integer
          description: Zero-based index of the paragraph containing the anchor
          minimum: 0
        startOffset:
          type: integer
          description: Start character offset within the paragraph
          minimum: 0
        endOffset:
          type: integer
          description: End character offset within the paragraph
          minimum: 0
        contentFingerprint:
          type: string
          description: Normalized text hash + bounded surrounding context for remapping
          minLength: 1
        state:
          $ref: "#/components/schemas/AnchorState"

    ResolutionStatus:
      type: string
      enum: [resolved, partially_resolved, still_unresolved, removed, unchanged]
      description: |
        resolved - user has addressed this feedback item
        partially_resolved - user has partially addressed it
        still_unresolved - feedback item remains unaddressed
        removed - anchor text no longer found in document
        unchanged - no progress on addressing the feedback

    FeedbackItem:
      type: object
      required: [id, documentId, errorCategoryId, kind, questionText, sourceDraftId, createdAt]
      properties:
        id:
          type: string
          description: Unique feedback item identifier
        documentId:
          type: string
          description: Foreign key to Document
        errorCategoryId:
          type: string
          description: Foreign key to ErrorCategory (feedback classification)
        kind:
          type: string
          enum: [inline, structural]
          description: |
            inline - feedback anchored to specific text span
            structural - feedback applies to the entire document
        questionText:
          type: string
          description: Socratic question presented to the user
        quotedText:
          type: string
          nullable: true
          description: Optional exact quote from the document that triggered this feedback
        currentAnchorId:
          type: string
          nullable: true
          description: Foreign key to current Anchor (for inline feedback) or null for structural
        sourceDraftId:
          type: string
          description: Foreign key to Draft (which version generated this feedback)
        createdAt:
          type: string
          format: date-time
          description: Timestamp when feedback was generated

    DocumentTypeConfig:
      type: object
      required: [documentTypeId]
      properties:
        documentTypeId:
          type: string
        tone:
          type: string
          nullable: true
        density:
          type: string
          nullable: true
        categoryPriority:
          type: array
          items:
            type: string
        typePromptText:
          type: string
          nullable: true
        toneDescription:
          type: string
          nullable: true
        densityDescription:
          type: string
          nullable: true
        structureDescription:
          type: string
          nullable: true
        restrictionsDescription:
          type: string
          nullable: true
        notesDescription:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          description: Unique global user identifier
        email:
          type: string
          description: User email address
          format: email

    # ==================== Analytics Schemas ====================

    AggregateCounter:
      type: object
      properties:
        scopeKind:
          type: string
          enum: [platform, documentType]
          description: |
            platform - counter aggregated across entire platform
            documentType - counter scoped to a specific document type
        scopeId:
          type: string
          nullable: true
          description: DocumentType ID if scopeKind is 'documentType', null if 'platform'
        metric:
          type: string
          description: Metric name (e.g., "documents_created", "feedback_generated")
        value:
          type: number
          description: Numeric value of the metric

    AnalyticsResult:
      type: object
      properties:
        totals:
          type: array
          items:
            $ref: "#/components/schemas/AggregateCounter"
          description: Array of aggregate counters

    HelpfulnessComment:
      type: object
      required: [helpful, comment, createdAt]
      properties:
        helpful:
          type: boolean
          description: Whether the student rated the feedback as helpful
        comment:
          type: string
          description: Anonymous free-text comment submitted alongside the rating
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the rating was submitted

    HelpfulnessAnalyticsResult:
      type: object
      required: [helpful, notHelpful, total, comments]
      properties:
        helpful:
          type: integer
          minimum: 0
          description: Count of ratings where helpful=true
        notHelpful:
          type: integer
          minimum: 0
          description: Count of ratings where helpful=false
        total:
          type: integer
          minimum: 0
          description: Total rating count (helpful + notHelpful)
        comments:
          type: array
          description: Up to 20 most-recent anonymous comments (no student identity)
          items:
            $ref: "#/components/schemas/HelpfulnessComment"

  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but insufficient role/scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

# --------------------------------------------------------------------------
# Default security (all endpoints require auth unless overridden)
# --------------------------------------------------------------------------
security:
  - CognitoAuthorizer: []

# --------------------------------------------------------------------------
# Paths
# --------------------------------------------------------------------------
paths:
  # ==================== Auth ====================
  /v1/auth/me:
    get:
      summary: Get the authenticated user's identity and DB-backed roles
      tags: [Auth]
      operationId: getMe
      responses:
        "200":
          description: Current user with roles
          content:
            application/json:
              schema:
                type: object
                required: [userId, email, roles, administeredDepartmentIds]
                properties:
                  userId:
                    type: string
                    description: Global user identifier (from app database)
                  email:
                    type: string
                    format: email
                    description: User email address
                  roles:
                    type: array
                    items:
                      type: string
                      enum: [Student, DepartmentAdmin, TechnicalAdmin]
                    description: Array of roles assigned to this user
                  administeredDepartmentIds:
                    type: array
                    items:
                      type: string
                    description: Department IDs administered by this user (if DepartmentAdmin)
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunctionArn}/invocations"
    options:
      summary: CORS preflight
      x-amazon-apigateway-integration:
        type: mock
        responses:
          default:
            statusCode: 200
            responseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Max-Age: "'86400'"
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Max-Age:
              schema:
                type: string

  # ==================== Departments & Document Types ====================
  /v1/departments:
    get:
      summary: List Department groupings
      tags: [Departments]
      operationId: listDepartments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunctionArn}/invocations"
    post:
      summary: Create a new Department (TechnicalAdmin only)
      tags: [Departments]
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunctionArn}/invocations"
    options:
      summary: CORS preflight
      security: []
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        passthroughBehavior: when_no_match
        responses:
          default:
            statusCode: 200
            responseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Accept,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Max-Age: "'86400'"
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Max-Age:
              schema:
                type: string

  /v1/document-types:
    get:
      summary: List Document Types (optional departmentId filter)
      tags: [DocumentTypes]
      operationId: listDocumentTypes
      parameters:
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of document types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunctionArn}/invocations"
    post:
      summary: Create a new Document Type (DepartmentAdmin only)
      tags: [DocumentTypes]
      operationId: createDocumentType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId, name]
              properties:
                departmentId:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Created document type
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunctionArn}/invocations"
    options:
      summary: CORS preflight
      security: []
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        passthroughBehavior: when_no_match
        responses:
          default:
            statusCode: 200
            responseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Accept,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Max-Age: "'86400'"
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Max-Age:
              schema:
                type: string

  /v1/document-types/{documentTypeId}/access-state:
    put:
      summary: Set Document Type student access state (OPEN or LOCKED)
      tags: [DocumentTypes]
      operationId: setDocumentTypeAccessState
      parameters:
        - name: documentTypeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessState]
              properties:
                accessState:
                  type: string
                  enum: [OPEN, LOCKED]
      responses:
        "200":
          description: Updated access state
          content:
            application/json:
              schema:
                type: object
                required: [accessState]
                properties:
                  accessState:
                    type: string
                    enum: [OPEN, LOCKED]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunctionArn}/invocations"
    options:
      summary: CORS preflight
      security: []
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        passthroughBehavior: when_no_match
        responses:
          default:
            statusCode: 200
            responseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Accept,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Max-Age: "'86400'"
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Max-Age:
              schema:
                type: string

  /v1/access-grants:
    get:
      summary: List the authenticated user's Access Grants
      tags: [AccessGrants]
      operationId: listMyAccessGrants
      responses:
        "200":
          description: Active access grants for the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminFunctionArn}/invocations"
    options:
      summary: CORS preflight
      security: []
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        passthroughBehavior: when_no_match
        responses:
          default:
            statusCode: 200
            responseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Accept,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,X-Amz-User-Agent'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Max-Age: "'86400'"
      responses:
        "200":
          description: 200 response
          headers:
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Max-Age:
              schema:
                type: string

  # ==================== Documents & Drafts ====================
  /v1/documents:
    get:
      summary: List the authenticated Student's documents
      tags: [Documents]
      operationId: listDocuments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Still Drafting, Polishing]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
