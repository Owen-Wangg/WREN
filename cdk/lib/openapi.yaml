  # ==================== Feedback Helpfulness Rating ====================
  /v1/feedback-helpfulness:
    post:
      summary: Record a student's helpfulness rating for their AI Debrief
      description: |
        Submitted by the owning Student after viewing their AI Debrief.
        Persisted anonymously (no user_id stored) so ratings can be surfaced
        as aggregate analytics to DepartmentAdmins without exposing per-Student
        identity (Requirements 16.1–16.5, 43.2).
      tags: [Feedback]
      operationId: recordFeedbackHelpfulness
      x-amazon-apigateway-request-validator: full
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environmentId, helpful]
              properties:
                environmentId:
                  type: string
                  format: uuid
                  description: Document ID (writing environment) the debrief belongs to
                draftId:
                  type: string
                  format: uuid
                  description: Draft version the debrief was generated against
                helpful:
                  type: boolean
                  description: Whether the student found the AI feedback helpful
                comment:
                  type: string
                  description: Optional anonymous free-text comment
                  maxLength: 1000
      responses:
        "200":
          description: Rating recorded
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded:
                    type: boolean
        "400":
          description: Validation error (missing required fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
